name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Show toolchain
        run: dotnet --info

      - name: Build Release
        shell: pwsh
        run: .\scripts\proxifyre.ps1 build -Configuration Release

      - name: Run packet self-test
        shell: pwsh
        run: .\scripts\proxifyre.ps1 test packet-selftest -Configuration Release

      - name: Stage release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "artifacts/bin/ProxiFyre/release_win-x64"
          $native = "artifacts/native/Release"
          $stage = "release/ProxiFyre"

          Remove-Item -LiteralPath "release" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "$source/*" -Destination $stage -Recurse -Force

          Remove-Item -LiteralPath `
            "$stage/app-config.json", `
            "$stage/traffic-test-config.json", `
            "$stage/proxifyre-core.log", `
            "$stage/proxifyre-ui.log" `
            -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $stage -Filter "*.pdb" -File | Remove-Item -Force

          Copy-Item -LiteralPath `
            "$native/ProxiFyre.Module.dll", `
            "$native/ProxiFyre.Probe.dll" `
            -Destination $stage -Force

          if (Test-Path -LiteralPath "$native/ProxiFyre.Wfp.sys") {
            Copy-Item -LiteralPath "$native/ProxiFyre.Wfp.sys" -Destination $stage -Force
          }
          if (Test-Path -LiteralPath "$native/ProxiFyre.Wfp.inf") {
            Copy-Item -LiteralPath "$native/ProxiFyre.Wfp.inf" -Destination $stage -Force
          }

          Copy-Item -LiteralPath "README.md" -Destination $stage -Force
          Copy-Item -LiteralPath "docs/UU_ACCELERATOR.md" -Destination $stage -Force

          $required = @(
            "ProxiFyre.exe",
            "ProxiFyre.dll",
            "ProxiFyre.deps.json",
            "ProxiFyre.runtimeconfig.json",
            "ProxiFyre.Module.dll",
            "ProxiFyre.Probe.dll",
            "manifest.json",
            "UuPatchProfiles.json"
          )
          $missing = @($required | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $stage $_))
          })
          if ($missing.Count -gt 0) {
            throw "Release staging is missing: $($missing -join ', ')"
          }

          Compress-Archive -Path "$stage/*" -DestinationPath "release/proxifyre-win-x64.zip" -Force

      - name: Upload Windows release
        uses: actions/upload-artifact@v7
        with:
          name: proxifyre-win-x64
          path: release/proxifyre-win-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Write build information
        shell: pwsh
        run: |
          @(
            "## Build artifact",
            "",
            "- Build ID: ``${{ github.run_id }}``",
            "- Commit: ``${{ github.sha }}``",
            "- Artifact: ``proxifyre-win-x64``",
            "- Package: ``proxifyre-win-x64.zip``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

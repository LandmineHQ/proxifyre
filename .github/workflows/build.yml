name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Show toolchain
        run: dotnet --info

      - name: Build Release
        shell: pwsh
        run: .\scripts\proxifyre.ps1 build -Configuration Release

      - name: Run packet self-test
        shell: pwsh
        run: .\scripts\proxifyre.ps1 test packet-selftest -Configuration Release

      - name: Run protocol self-tests
        shell: pwsh
        run: |
          .\scripts\proxifyre.ps1 test tcp-selftest -Configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\proxifyre.ps1 test udp-selftest -Configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows release
        shell: pwsh
        run: .\scripts\proxifyre.ps1 package -Configuration Release

      - name: Upload Windows release
        uses: actions/upload-artifact@v7
        with:
          name: proxifyre-win-x64
          path: release/proxifyre-win-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Write build information
        shell: pwsh
        run: |
          @(
            "## Build artifact",
            "",
            "- Build ID: ``${{ github.run_id }}``",
            "- Commit: ``${{ github.sha }}``",
            "- Artifact: ``proxifyre-win-x64``",
            "- Package: ``proxifyre-win-x64.zip``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
